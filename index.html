<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        
        <p id="my-text">This is my first Javascript code.</p>
        <button id="my-button">Click me</button>
    </div>

    <script>
        let newText = "this will not be my last javascript code"
        document.getElementById("my-button").addEventListener("click", function() {
            document.getElementById("my-text").innerHTML = newText;
        });

    </script>
</body>
</html>
